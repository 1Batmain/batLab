# File purpose: Cargo manifest for the batlab_ui crate — the native front-ends
# (ratatui terminal UI, winit visualiser window) and the on-disk layout of
# Models/ and datasets/. Everything here is desktop-only by construction; the
# engine it drives is batlab_core, which stays portable.

[package]
name = "batlab_ui"
version = "0.1.0"
edition = "2024"


[dependencies]
batlab_core = { path = "../batlab-core" }
bytemuck = "1.25.0"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wgpu = "28.0.0"
winit = "0.30.12"
